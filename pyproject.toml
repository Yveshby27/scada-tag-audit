[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scada-tag-audit"
version = "0.1.1"
description = "Pre-commissioning cross-vendor tag database drift audit for SCADA/HMI integrators. Reads Ignition tag CSVs + Rockwell L5X exports; surfaces naming, address, orphan, unit, and type drift as a self-contained HTML report."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Yves Habchy", email = "yves.habchy@gmail.com"}]
keywords = ["scada", "hmi", "plc", "ignition", "rockwell", "tag-drift", "audit", "commissioning", "integrator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Topic :: Software Development :: Quality Assurance",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyinstaller>=6.0"]

[project.scripts]
scada-tag-audit = "scada_tag_audit.cli:main"

[project.urls]
Homepage = "https://github.com/Yveshby27/scada-tag-audit"
Repository = "https://github.com/Yveshby27/scada-tag-audit"
Documentation = "https://github.com/Yveshby27/scada-tag-audit#readme"
"Bug Tracker" = "https://github.com/Yveshby27/scada-tag-audit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/scada_tag_audit"]
